<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sílabas dos Animais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8FDcFF;
    --sky-bot:#C7F0FF;
    --grass:#7BC96F;
    --grass-dark:#5BB05A;
    --sun:#FFD23F;
    --coral:#FF6F91;
    --coral-dark:#F0466E;
    --purple:#9B6BF2;
    --cream:#FFFDF5;
    --ink:#3A2E5C;
    --c1:#FF6F91; --c2:#FFB03A; --c3:#4FC3E8; --c4:#8CD25A; --c5:#B07BF2;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    color:var(--ink);
    overflow-x:hidden;overflow-y:auto;
    -webkit-text-size-adjust:100%;
    background:#C7F0FF;
    position:relative;
    user-select:none;
  }

  /* ---------- CENÁRIO ---------- */
  .scene{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bot) 58%, #E9FBE3 58%, #D6F5C9 100%);}
  .sun{
    position:absolute;top:4vh;left:6vw;width:min(20vw,150px);height:min(20vw,150px);
    background:radial-gradient(circle at 50% 50%, #FFE985 0%, var(--sun) 60%, #FFC01F 100%);
    border-radius:50%;
    box-shadow:0 0 60px rgba(255,210,63,.7);
    animation:sunpulse 5s ease-in-out infinite;
  }
  .sun::before{
    content:"";position:absolute;inset:-26%;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 12deg,rgba(255,214,80,.55) 12deg 20deg,transparent 20deg 30deg);
    animation:spin 40s linear infinite;
  }
  @keyframes sunpulse{50%{transform:scale(1.06)}}
  @keyframes spin{to{transform:rotate(360deg)}}

  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.95;
    filter:drop-shadow(0 8px 10px rgba(80,120,160,.15));}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .cloud.a{width:130px;height:42px;top:12vh;left:-160px;animation:drift 34s linear infinite;}
  .cloud.b{width:90px;height:32px;top:26vh;left:-120px;animation:drift 48s linear infinite;animation-delay:-8s;transform:scale(1.3)}
  .cloud.c{width:110px;height:38px;top:6vh;left:-140px;animation:drift 60s linear infinite;animation-delay:-20s;}
  .cloud::before{width:55%;height:150%;top:-55%;left:12%;}
  .cloud::after{width:42%;height:130%;top:-45%;right:14%;}
  @keyframes drift{to{transform:translateX(115vw)}}

  .hills{position:absolute;left:0;right:0;bottom:0;height:42vh;z-index:0;}
  .hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;}
  .hill.h1{width:70vw;height:26vh;left:-10vw;background:var(--grass-dark);opacity:.55}
  .hill.h2{width:80vw;height:22vh;right:-14vw;background:var(--grass-dark);opacity:.4}
  .ground{position:absolute;left:0;right:0;bottom:0;height:20vh;background:linear-gradient(180deg,var(--grass),var(--grass-dark));}
  .flower{position:absolute;bottom:3vh;font-size:clamp(20px,3vw,34px);animation:sway 4s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  .float-emoji{position:absolute;opacity:.5;font-size:26px;animation:bob 6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  /* ---------- LAYOUT ---------- */
  .app{position:relative;z-index:2;height:auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:min(2.4vh,18px) 16px 14px;gap:8px;}

  .title{
    font-family:'Baloo 2',cursive;font-weight:800;
    font-size:clamp(30px,6.4vw,68px);line-height:.95;margin:0;text-align:center;
    letter-spacing:.5px;filter:drop-shadow(0 4px 0 rgba(58,46,92,.18));
  }
  .title span{display:inline-block;animation:letterbob 3s ease-in-out infinite;}
  .title .t1{color:#FF5C8A}.title .t2{color:#FFB03A}.title .t3{color:#4FC3E8}
  .title .t4{color:#8CD25A}.title .t5{color:#B07BF2}.title .t6{color:#FF7A59}
  .title span:nth-child(2n){animation-delay:.4s}
  .title span:nth-child(3n){animation-delay:.8s}
  @keyframes letterbob{50%{transform:translateY(-6px) rotate(-2deg)}}

  .progress{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:92vw;}
  .dot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(58,46,92,.25);transition:.25s;}
  .dot.done{background:var(--c4);border-color:var(--grass-dark);}
  .dot.current{transform:scale(1.5);background:var(--coral);border-color:var(--coral-dark);}
  .progress .count{font-weight:700;margin-left:8px;font-size:clamp(15px,2vw,20px);color:var(--ink);
    background:#fff;padding:3px 12px;border-radius:20px;box-shadow:0 3px 0 rgba(58,46,92,.12);}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;max-width:900px;gap:min(2.4vh,18px);min-height:0;}

  .card{
    position:relative;background:var(--cream);
    border-radius:36px;padding:clamp(14px,3vh,30px) clamp(24px,5vw,48px) clamp(20px,3vh,34px);
    box-shadow:0 18px 0 rgba(58,46,92,.10), 0 26px 40px rgba(58,46,92,.22);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    border:6px solid #fff;
  }
  .spotlight{
    position:relative;width:clamp(120px,20vh,190px);height:clamp(120px,20vh,190px);
    display:flex;align-items:center;justify-content:center;
  }
  .spotlight::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #FFF6D8 0%, #FFE9A8 55%, rgba(255,233,168,0) 72%);
  }
  .animal{
    font-size:clamp(78px,15vh,150px);line-height:1;position:relative;z-index:1;
    filter:drop-shadow(0 12px 10px rgba(58,46,92,.28));
    animation:animbob 3.2s ease-in-out infinite;
  }
  @keyframes animbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
  .shadow{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:52%;height:16px;
    background:rgba(58,46,92,.18);border-radius:50%;filter:blur(3px);animation:shwob 3.2s ease-in-out infinite;}
  @keyframes shwob{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.8)}}
  .animal.cheer{animation:cheer .6s ease;}
  @keyframes cheer{0%{transform:scale(1)}30%{transform:translateY(-30px) scale(1.15) rotate(-8deg)}
    60%{transform:translateY(-10px) scale(1.1) rotate(8deg)}100%{transform:translateY(0) scale(1)}}

  .ask{font-weight:500;font-size:clamp(15px,2.3vw,22px);color:#7a6fa0;margin-top:2px;}

  .word{font-family:'Baloo 2',cursive;font-weight:800;
    font-size:clamp(30px,6vw,58px);letter-spacing:.16em;color:var(--ink);
    display:flex;gap:.02em;flex-wrap:wrap;justify-content:center;min-height:1.1em;}
  .word .syl{display:inline-block;padding:0 .06em;border-radius:14px;transition:.3s;}
  .word.solved .syl{animation:sylpop .5s cubic-bezier(.2,1.4,.5,1) both;padding:.02em .22em;margin:0 3px;color:#fff;}
  .word.solved .syl:nth-child(5n+1){background:var(--c1)}
  .word.solved .syl:nth-child(5n+2){background:var(--c2)}
  .word.solved .syl:nth-child(5n+3){background:var(--c3)}
  .word.solved .syl:nth-child(5n+4){background:var(--c4)}
  .word.solved .syl:nth-child(5n+5){background:var(--c5)}
  @keyframes sylpop{0%{transform:scale(0) rotate(-12deg);opacity:0}100%{transform:scale(1);opacity:1}}

  /* ---------- BOLINHAS ---------- */
  .bubbles{display:flex;flex-wrap:wrap;gap:clamp(10px,1.8vw,18px);justify-content:center;max-width:96vw;}
  .bubble{
    width:clamp(48px,8.5vw,74px);height:clamp(48px,8.5vw,74px);border-radius:50%;
    border:5px solid #fff;background:#EAF6FF;cursor:pointer;position:relative;
    box-shadow:0 6px 0 rgba(58,46,92,.14), inset 0 -6px 10px rgba(120,150,190,.18);
    transition:transform .12s ease;padding:0;
  }
  .bubble::after{content:"";position:absolute;top:16%;left:20%;width:26%;height:22%;border-radius:50%;
    background:rgba(255,255,255,.85);}
  .bubble:active{transform:scale(.9)}
  .bubble.on{border-color:#fff;animation:pop .4s cubic-bezier(.2,1.5,.5,1);}
  .bubble.on:nth-child(5n+1){background:radial-gradient(circle at 35% 30%,#FFA6BE,var(--c1))}
  .bubble.on:nth-child(5n+2){background:radial-gradient(circle at 35% 30%,#FFD07A,var(--c2))}
  .bubble.on:nth-child(5n+3){background:radial-gradient(circle at 35% 30%,#9BE0F5,var(--c3))}
  .bubble.on:nth-child(5n+4){background:radial-gradient(circle at 35% 30%,#BEEB8F,var(--c4))}
  .bubble.on:nth-child(5n+5){background:radial-gradient(circle at 35% 30%,#D2B4F7,var(--c5))}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  .bubbles.locked .bubble{cursor:default;}

  .hint{font-weight:500;color:#8a7fb0;font-size:clamp(13px,1.9vw,18px);text-align:center;}

  /* ---------- BOTÕES ---------- */
  .nav{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding-bottom:4px;}
  .btn{font-family:'Fredoka';font-weight:700;font-size:clamp(15px,2.2vw,21px);
    border:none;border-radius:22px;padding:12px 24px;cursor:pointer;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s, box-shadow .1s;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn.back{background:#B9AEDD;color:#4a3f70;}
  .btn.next{background:linear-gradient(180deg,#FF8AAA,var(--coral-dark));}
  .btn.next:disabled{background:#D9D2EC;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.08);cursor:default;opacity:.7;}
  .btn.next.ready{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .icon-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;cursor:pointer;
    font-size:22px;box-shadow:0 4px 0 rgba(58,46,92,.15);display:grid;place-items:center;}
  .icon-btn:active{transform:translateY(3px);}
  .topbar{position:fixed;top:10px;right:12px;z-index:5;display:flex;gap:8px;}

  /* ---------- BANNER ACERTOU ---------- */
  .cheer-banner{position:fixed;top:14vh;left:50%;transform:translateX(-50%) scale(0);z-index:6;
    font-family:'Baloo 2';font-weight:800;font-size:clamp(28px,6vw,60px);color:#fff;
    background:linear-gradient(180deg,#FFC93F,#FF9A3D);padding:10px 34px;border-radius:30px;
    border:5px solid #fff;box-shadow:0 12px 26px rgba(58,46,92,.3);white-space:nowrap;pointer-events:none;
    text-shadow:0 3px 0 rgba(220,120,20,.4);}
  .cheer-banner.show{animation:banner 1.8s ease forwards;}
  @keyframes banner{0%{transform:translateX(-50%) scale(0) rotate(-8deg)}
    18%{transform:translateX(-50%) scale(1.12) rotate(3deg)}
    30%{transform:translateX(-50%) scale(1) rotate(0)}
    82%{transform:translateX(-50%) scale(1);opacity:1}
    100%{transform:translateX(-50%) scale(.9);opacity:0}}

  #confetti{position:fixed;inset:0;z-index:7;pointer-events:none;}

  /* ---------- FINAL ---------- */
  .final{position:fixed;inset:0;z-index:9;background:rgba(58,46,92,.55);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:20px;}
  .final.show{display:flex;animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0}}
  .final-card{background:var(--cream);border-radius:36px;border:8px solid #fff;padding:34px 30px;
    text-align:center;max-width:460px;box-shadow:0 24px 50px rgba(0,0,0,.35);animation:pops .5s cubic-bezier(.2,1.4,.5,1);}
  @keyframes pops{from{transform:scale(.6);opacity:0}}
  .final-card h2{font-family:'Baloo 2';font-weight:800;font-size:clamp(28px,6vw,44px);margin:.2em 0;color:var(--coral-dark);}
  .final-card .big{font-size:clamp(60px,14vw,90px);}
  .final-card p{font-size:18px;color:#6a5f95;margin:.4em 0 1em;}

  .bubble,.btn,.icon-btn{touch-action:manipulation;}

  /* ---------- CELULAR (retrato) ---------- */
  @media (max-width:640px){
    .app{padding:8px 10px 12px;gap:6px;}
    .title{font-size:clamp(25px,8vw,40px);}
    .topbar{top:8px;right:8px;gap:6px;}
    .icon-btn{width:40px;height:40px;font-size:19px;}
    .sun{width:88px;height:88px;top:1.5vh;left:3vw;}
    .cloud.a,.cloud.c{display:none;}
    .float-emoji{display:none;}
    .progress{gap:4px;}
    .dot{width:9px;height:9px;border-width:1.5px;}
    .progress .count{font-size:14px;padding:2px 10px;margin-left:6px;}
    .stage{gap:10px;}
    .card{padding:12px 18px 16px;border-radius:28px;border-width:5px;gap:4px;
      box-shadow:0 12px 0 rgba(58,46,92,.10),0 18px 28px rgba(58,46,92,.2);}
    .spotlight{width:clamp(104px,36vw,150px);height:clamp(104px,36vw,150px);}
    .animal{font-size:clamp(66px,27vw,120px);}
    .ask{font-size:15px;}
    .word{font-size:clamp(26px,8.4vw,46px);letter-spacing:.1em;}
    .bubbles{gap:9px;}
    .bubble{width:clamp(46px,13.5vw,64px);height:clamp(46px,13.5vw,64px);border-width:4px;}
    .btn{padding:12px 22px;font-size:16px;}
    .hint{font-size:13px;}
    .cheer-banner{font-size:clamp(24px,8vw,42px);padding:9px 24px;}
  }

  /* ---------- CELULAR (paisagem / tela baixa) ---------- */
  @media (max-height:560px) and (orientation:landscape){
    .app{gap:3px;padding:6px 12px 8px;}
    .title{font-size:clamp(20px,5.6vh,32px);}
    .sun{width:70px;height:70px;}
    .cloud{display:none;}
    .float-emoji{display:none;}
    .progress{gap:3px;}
    .dot{width:8px;height:8px;}
    .stage{gap:8px;}
    .card{padding:6px 20px 10px;border-radius:22px;border-width:4px;gap:2px;}
    .spotlight{width:clamp(72px,20vh,120px);height:clamp(72px,20vh,120px);}
    .animal{font-size:clamp(50px,18vh,100px);}
    .ask{display:none;}
    .word{font-size:clamp(22px,6.5vh,40px);}
    .bubbles{gap:8px;}
    .bubble{width:clamp(42px,11vh,58px);height:clamp(42px,11vh,58px);border-width:4px;}
    .hint{display:none;}
    .btn{padding:9px 18px;font-size:15px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud a"></div><div class="cloud b"></div><div class="cloud c"></div>
    <div class="hills">
      <div class="hill h1"></div><div class="hill h2"></div>
      <div class="ground"></div>
    </div>
    <div class="flower" style="left:8vw">🌼</div>
    <div class="flower" style="left:22vw;animation-delay:.6s">🌷</div>
    <div class="flower" style="right:12vw;animation-delay:1.1s">🌻</div>
    <div class="flower" style="right:28vw;animation-delay:.3s">🌸</div>
    <div class="float-emoji" style="top:20vh;right:9vw">🦋</div>
    <div class="float-emoji" style="top:34vh;left:5vw;animation-delay:2s">🐞</div>
  </div>

  <div class="topbar">
    <button class="icon-btn" id="soundBtn" title="Ligar/desligar som" aria-label="Som">🔊</button>
    <button class="icon-btn" id="restartBtn" title="Recomeçar" aria-label="Recomeçar">🔄</button>
  </div>

  <div class="app">
    <h1 class="title" id="title"></h1>
    <div class="progress" id="progress"></div>

    <div class="stage">
      <div class="card">
        <div class="spotlight">
          <div class="shadow"></div>
          <div class="animal" id="animal">🐝</div>
        </div>
        <div class="ask">Quantas sílabas tem a palavra?</div>
        <div class="word" id="word"></div>
      </div>

      <div class="bubbles" id="bubbles"></div>
      <div class="hint" id="hint">Fale o nome do animal e clique uma bolinha para cada sílaba 👆</div>
    </div>

    <div class="nav">
      <button class="btn back" id="backBtn">← Voltar</button>
      <button class="btn next" id="nextBtn" disabled>Próximo →</button>
    </div>
  </div>

  <div class="cheer-banner" id="banner">Muito bem! 🎉</div>
  <canvas id="confetti"></canvas>

  <div class="final" id="final">
    <div class="final-card">
      <div class="big">🏆</div>
      <h2>Você conseguiu!</h2>
      <p>Você contou as sílabas de todos os 16 animais. Parabéns, campeão(ã)! 🌟</p>
      <button class="btn next" id="playAgain">Jogar de novo 🔄</button>
    </div>
  </div>

<script>
const ANIMALS = [
  {name:"Abelha",     emoji:"🐝", syl:["A","BE","LHA"]},
  {name:"Cavalo",     emoji:"🐴", syl:["CA","VA","LO"]},
  {name:"Elefante",   emoji:"🐘", syl:["E","LE","FAN","TE"]},
  {name:"Gorila",     emoji:"🦍", syl:["GO","RI","LA"]},
  {name:"Hipopótamo", emoji:"🦛", syl:["HI","PO","PÓ","TA","MO"]},
  {name:"Iguana",     emoji:"🦎", syl:["I","GUA","NA"]},
  {name:"Jacaré",     emoji:"🐊", syl:["JA","CA","RÉ"]},
  {name:"Leão",       emoji:"🦁", syl:["LE","ÃO"]},
  {name:"Macaco",     emoji:"🐵", syl:["MA","CA","CO"]},
  {name:"Onça",       emoji:"🐆", syl:["ON","ÇA"]},
  {name:"Rato",       emoji:"🐭", syl:["RA","TO"]},
  {name:"Pato",       emoji:"🦆", syl:["PA","TO"]},
  {name:"Tucano",     emoji:"🦜", syl:["TU","CA","NO"]},
  {name:"Urso",       emoji:"🐻", syl:["UR","SO"]},
  {name:"Gato",       emoji:"🐱", syl:["GA","TO"]},
  {name:"Cachorro",   emoji:"🐶", syl:["CA","CHOR","RO"]},
];
const NUMWORDS = {1:"uma",2:"duas",3:"três",4:"quatro",5:"cinco"};

let idx = 0;
const solved = new Array(ANIMALS.length).fill(false);
let soundOn = true;
let audioCtx = null;

// ---- título colorido ----
(function(){
  const t = document.getElementById('title');
  const txt = "Sílabas dos Animais";
  let cls=1;
  [...txt].forEach(ch=>{
    if(ch===' '){ t.appendChild(document.createTextNode(' ')); return; }
    const s=document.createElement('span');
    s.className='t'+cls; s.textContent=ch;
    cls = cls%6 + 1;
    t.appendChild(s);
  });
})();

// ---- progresso ----
const progressEl = document.getElementById('progress');
function buildProgress(){
  progressEl.innerHTML='';
  ANIMALS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(solved[i]?' done':'')+(i===idx?' current':'');
    progressEl.appendChild(d);
  });
  const c=document.createElement('div');
  c.className='count';
  c.textContent = (idx+1)+' / '+ANIMALS.length;
  progressEl.appendChild(c);
}

// ---- áudio ----
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}
function beep(freq,start,dur){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='triangle'; o.frequency.value=freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t=audioCtx.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.25,t+.03);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur+.05);
}
function clickSound(){
  if(!soundOn) return; ensureAudio(); beep(660,0,.12);
}
function winSound(){
  if(!soundOn) return; ensureAudio();
  [523,659,784,1047].forEach((f,i)=>beep(f,i*0.12,.28));
}
function speak(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='pt-BR'; u.rate=.95; u.pitch=1.1;
    const v=speechSynthesis.getVoices().find(v=>/pt-BR|pt_BR|português|Portuguese/i.test(v.lang+v.name));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; }

// ---- render ----
const animalEl=document.getElementById('animal');
const wordEl=document.getElementById('word');
const bubblesEl=document.getElementById('bubbles');
const nextBtn=document.getElementById('nextBtn');
const backBtn=document.getElementById('backBtn');
const hintEl=document.getElementById('hint');

function render(){
  const a=ANIMALS[idx];
  const need=a.syl.length;
  const total=need+2;

  animalEl.textContent=a.emoji;
  animalEl.classList.remove('cheer');

  // palavra
  wordEl.className='word';
  wordEl.innerHTML='';
  if(solved[idx]){
    a.syl.forEach(s=>{ const el=document.createElement('span'); el.className='syl'; el.textContent=s; wordEl.appendChild(el); });
    wordEl.classList.add('solved');
  }else{
    const full=a.syl.join('');
    [...full].forEach(ch=>{ const el=document.createElement('span'); el.className='syl'; el.textContent=ch; wordEl.appendChild(el); });
  }

  // bolinhas
  bubblesEl.className='bubbles'+(solved[idx]?' locked':'');
  bubblesEl.innerHTML='';
  for(let i=0;i<total;i++){
    const b=document.createElement('button');
    b.className='bubble'+(solved[idx]&&i<need?' on':'');
    b.setAttribute('aria-label','bolinha '+(i+1));
    b.addEventListener('click',()=>onBubble(b));
    bubblesEl.appendChild(b);
  }

  hintEl.textContent = solved[idx]
    ? '👏 '+a.name+' tem '+NUMWORDS[need]+' sílabas!'
    : 'Fale o nome do animal e clique uma bolinha para cada sílaba 👆';

  nextBtn.disabled = !solved[idx];
  nextBtn.classList.toggle('ready', solved[idx]);
  backBtn.disabled = idx===0;
  backBtn.style.visibility = idx===0 ? 'hidden':'visible';
  nextBtn.textContent = idx===ANIMALS.length-1 ? 'Terminar 🏁' : 'Próximo →';

  buildProgress();
}

function onBubble(b){
  if(solved[idx]) return;
  b.classList.toggle('on');
  clickSound();
  const on=bubblesEl.querySelectorAll('.bubble.on').length;
  const need=ANIMALS[idx].syl.length;
  if(on===need){ win(); }
}

function win(){
  solved[idx]=true;
  const a=ANIMALS[idx];
  bubblesEl.classList.add('locked');
  // segmenta a palavra
  wordEl.innerHTML='';
  a.syl.forEach(s=>{ const el=document.createElement('span'); el.className='syl'; el.textContent=s; wordEl.appendChild(el); });
  wordEl.classList.add('solved');

  animalEl.classList.remove('cheer'); void animalEl.offsetWidth; animalEl.classList.add('cheer');
  showBanner();
  winSound();
  confettiBurst();
  hintEl.textContent='👏 '+a.name+' tem '+NUMWORDS[a.syl.length]+' sílabas!';
  nextBtn.disabled=false; nextBtn.classList.add('ready');
  buildProgress();
  speak(a.name+'! '+NUMWORDS[a.syl.length]+' sílabas!');

  if(solved.every(Boolean)){ setTimeout(showFinal,1400); }
}

// ---- banner ----
const banner=document.getElementById('banner');
const CHEERS=["Muito bem! 🎉","Você acertou! 🌟","Isso mesmo! 🎈","Parabéns! 👏","Boa! ⭐"];
function showBanner(){
  banner.textContent=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
}

// ---- confete ----
const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
let parts=[], raf=null;
function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
resize(); addEventListener('resize',resize);
const COLORS=['#FF6F91','#FFB03A','#4FC3E8','#8CD25A','#B07BF2','#FFD23F'];
const SHAPES=['⭐','🎉','✨','🌟','🎈'];
function confettiBurst(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n=reduce?18:90;
  for(let i=0;i<n;i++){
    parts.push({
      x:innerWidth/2+(Math.random()-.5)*120,
      y:innerHeight*0.32,
      vx:(Math.random()-.5)*11,
      vy:-Math.random()*13-4,
      g:0.28+Math.random()*0.12,
      size:8+Math.random()*10,
      rot:Math.random()*6.28,
      vr:(Math.random()-.5)*0.3,
      color:COLORS[i%COLORS.length],
      emoji: Math.random()<0.25 ? SHAPES[Math.floor(Math.random()*SHAPES.length)] : null,
      life:0
    });
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.emoji){ ctx.font=(p.size*2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.emoji,0,0); }
    else{ ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); }
    ctx.restore();
  });
  parts=parts.filter(p=>p.y<cv.height+40 && p.life<260);
  if(parts.length){ raf=requestAnimationFrame(tick); } else { ctx.clearRect(0,0,cv.width,cv.height); raf=null; }
}

// ---- navegação ----
nextBtn.addEventListener('click',()=>{
  if(nextBtn.disabled) return;
  if(idx<ANIMALS.length-1){ idx++; render(); }
  else if(solved.every(Boolean)){ showFinal(); }
});
backBtn.addEventListener('click',()=>{ if(idx>0){ idx--; render(); } });

// ---- som / restart ----
const soundBtn=document.getElementById('soundBtn');
soundBtn.addEventListener('click',()=>{
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?'🔊':'🔇';
  if(soundOn){ ensureAudio(); }
  else if('speechSynthesis' in window){ speechSynthesis.cancel(); }
});
document.getElementById('restartBtn').addEventListener('click',restart);
document.getElementById('playAgain').addEventListener('click',()=>{ document.getElementById('final').classList.remove('show'); restart(); });
function restart(){ solved.fill(false); idx=0; render(); }

// ---- final ----
function showFinal(){ document.getElementById('final').classList.add('show'); confettiBurst(); winSound(); }

// desbloqueia áudio no primeiro toque
document.body.addEventListener('pointerdown',()=>{ ensureAudio(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); },{once:true});

render();
</script>
</body>
